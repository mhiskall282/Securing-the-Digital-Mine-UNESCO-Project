services:
  # 1. Python Inference Backend Server (Public Web Service)
  - type: web
    name: api-service
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/api_service.py"
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: "8001"

  # 2. Laravel Livewire Multi-tenant Central Dashboard (Public Web Service)
  - type: web
    name: minesec-dashboard
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: MODEL_SERVER_URL
        value: "http://api-service:8001/api/analyze"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: minesec-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        fromDatabase:
          name: minesec-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: minesec-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: minesec-db
          property: password

# 3. PostgreSQL Database Instance (Active Standard High Tier)
databases:
  - name: minesec-db
    plan: standard_8gb
    region: oregon
