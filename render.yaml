services:
  # 1. Python Inference Backend Server (Production Web Service)
  - type: web
    name: api-service-prod
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/api_service.py"
    plan: pro
    region: oregon
    envVars:
      - key: PORT
        value: "8001"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # 2. Laravel Livewire Multi-tenant Central Dashboard (Production Web Service)
  - type: web
    name: minesec-dashboard-prod
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    plan: pro
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: MODEL_SERVER_URL
        value: "http://api-service-prod:8001/api/analyze"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: minesec-db-prod
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        fromDatabase:
          name: minesec-db-prod
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: minesec-db-prod
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: minesec-db-prod
          property: password

# 3. Managed PostgreSQL Database Cluster (Production Instance)
databases:
  - name: minesec-db-prod
    plan: pro-8gb
    region: oregon
